services:
  mysql:
    image: mysql:8.4
    container_name: pawcare-mysql
    environment:
      MYSQL_DATABASE: pawcare
      MYSQL_USER: pawcare
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pawcare_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 本机已有 MySQL 占用 3306 时，容器走 3307。
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pawcare-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: pawcare-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://pawcare:${MYSQL_PASSWORD:-pawcare_dev_password}@mysql:3306/pawcare?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      # 首次检索会下载 BGE 模型；挂载后重建镜像不必重新下载。
      - ./backend/.fastembed_cache:/app/.fastembed_cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: pawcare-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
