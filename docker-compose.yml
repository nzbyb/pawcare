services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pawcare-postgres
    environment:
      POSTGRES_DB: pawcare
      POSTGRES_USER: pawcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawcare_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawcare -d pawcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pawcare-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: pawcare-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://pawcare:${POSTGRES_PASSWORD:-pawcare_dev_password}@postgres:5432/pawcare
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: pawcare-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
