# 固定项目名：目录名含中文时 Docker 推导不出合法项目名。
name: pawcare

services:
  mysql:
    image: mysql:8.4
    container_name: pawcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pawcare
      MYSQL_USER: pawcare
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pawcare_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 只监听本机，避免把数据库端口暴露到公网。
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pawcare-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: pawcare-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://pawcare:${MYSQL_PASSWORD:-pawcare_dev_password}@mysql:3306/pawcare?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
    ports:
      # 前端 Nginx 会代理 /api；直接访问 API 只对本机开放。
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      # 支付宝私钥/公钥放在宿主机，只读挂进容器；该目录不提交仓库。
      - ./backend/secrets:/app/secrets:ro
      # 首次检索会下载 BGE 模型；挂载后重建镜像不必重新下载。
      - ./backend/.fastembed_cache:/app/.fastembed_cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        # 演示账号入口；正式对外时可设为 false 后重新构建前端
        VITE_DEMO_ACCOUNTS: ${VITE_DEMO_ACCOUNTS:-true}
    container_name: pawcare-frontend
    restart: unless-stopped
    ports:
      # 本地默认 8080；服务器上设 FRONTEND_PORT=80 直接对外。
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
